[backdrop]
blur_intensity = 0.50999998860061169

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.57999998703598976
    border = "on_primary"
    border_width = 1.0
    capsule_thickness = 0.6699999887496233
    center = [ "active_window" ]
    end = [ "tray", "group:g1", "clock", "notifications" ]
    font_family = "Adwaita Mono"
    margin_edge = 4
    margin_ends = 12
    padding = 13
    radius = 26
    scale = 1.350000012665987
    shadow = false
    start = [ "launcher", "privacy", "media", "taskbar", "hypr-submap" ]
    thickness = 41
    widget_spacing = 12

        [bar.default.dead_zone.actions]
        middle = "panel-toggle wallpaper"

        [[bar.default.capsule_group]]
        border = ""
        fill = "on_secondary"
        id = "g1"
        members = [ "network", "bluetooth", "volume", "brightness", "battery" ]
        opacity = 0.60000002384185791
        padding = 13.0

[calendar]
enabled = true

[control_center]
sidebar = "full"
sidebar_section = "full"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 229.0
    box_width = 720.0
    cx = 960.0
    cy = 961.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_hint = true
        show_session_buttons = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 229.0
    box_width = 810.0
    cx = 960.0
    cy = 1001.5
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

[notification]
background_opacity = 0.79999998211860657

[plugin_settings."noctalia/mpvpaper"]
video_directory = "~/pers/media/videos"

[plugins]
enabled = [ "k4n4t4/hypr-submap" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
app_icon_color = "secondary"
button_borders = false
corner_radius_scale = 2.0
font_family = "Noto Sans"
input_borders = false
polkit_agent = true
popup_borders = false
popup_shadows = false
settings_show_advanced = true

    [shell.animation]
    speed = 0.7500000111758709

    [shell.panel]
    borders = false
    control_center_position = "center"
    shadow = false

    [shell.screenshot]
    directory = "~/pers/media/imgs/screenshots"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "x"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "s"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "h"
    variant = "destructive"

    [shell.shadow]
    direction = "center"

[theme]
builtin = "Gruvbox"
community_palette = "ADW"
mode = "dark"
source = "builtin"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "kitty", "mango", "niri", "qt", "wezterm" ]
    enable_builtin_templates = true
    enable_community_templates = false

[wallpaper]
directory = "~/pers/media/imgs/wallpapers"
directory_dark = "~/pers/media/imgs/wallpapers"
directory_light = "~/pers/media/imgs/wallpapers"
transition_on_startup = true

    [wallpaper.automation]
    interval_seconds = 1

    [wallpaper.default]
    path = "~/pers/media/imgs/wallpapers/wallpaper.png"

    [wallpaper.last]
    path = "~/pers/media/imgs/wallpapers/wallpaper.png"

    [wallpaper.monitors.DP-1]
    path = "~/pers/media/imgs/wallpapers/wallpaper.png"

    [wallpaper.monitors.eDP-1]
    path = "~/pers/media/imgs/wallpapers/wallpaper.png"

[widget.active_window]
icon_size = 20
title_scroll = "on_hover"

[widget.battery]
show_label = false

[widget.brightness]
capsule_fill = "on_secondary"
show_label = false

[widget.hypr-submap]
hide_when_default = true
type = "k4n4t4/hypr-submap:hypr-submap"

[widget.launcher]
glyph = "menu-2"

[widget.media]
album_art_only = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.privacy]
hide_inactive = true

[widget.taskbar]
group_by_workspace = true
hide_empty_workspaces = true
inactive_opacity = 0.59999999999999998
show_active_indicator = false
workspace_group_capsule = false
workspace_label_placement = "inside"

[widget.volume]
capsule_fill = "on_secondary"
capsule_padding = 16.0
show_label = false

[widget.workspaces]
hide_when_empty = true
