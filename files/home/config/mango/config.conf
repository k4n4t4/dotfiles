# ------------------------------------------------------------------------------
# Auto Start Commands
# ------------------------------------------------------------------------------
exec-once=uwsm app -- fcitx5 -d
exec-once=uwsm app -- noctalia

# ------------------------------------------------------------------------------
# Appearance & Window Decoration
# ------------------------------------------------------------------------------
borderpx=2
gappih=4
gappiv=4
gappoh=10
gappov=10
border_radius=10
focused_opacity=0.9
unfocused_opacity=0.8

# Blur Settings
blur=0
blur_layer=0
blur_optimized=0
blur_params_num_passes=2
blur_params_radius=2
blur_params_noise=0.0
blur_params_contrast = 0.9

# Shadow Settings
shadows=0

# Colors
rootcolor=0x201b14ff
bordercolor=0x444444ff
focuscolor=0xc9b890ff

# ------------------------------------------------------------------------------
# Animation Configuration
# ------------------------------------------------------------------------------
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
animation_duration_move=300
animation_duration_open=300
animation_duration_close=200
animation_duration_tag=300
animation_curve_open=0.34,1.0,0.64,1.0
animation_curve_close=0.0,0.0,1.0,1.0
animation_curve_move=0.85,0.0,0.15,1.0
animation_curve_tag=0.65,0.0,0.35,1.0

# ------------------------------------------------------------------------------
# Scroller Layout Settings
# ------------------------------------------------------------------------------
scroller_default_proportion=0.75
scroller_focus_center=0
scroller_prefer_center=0

# Default Layout Assignment
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# ------------------------------------------------------------------------------
# Input Device Configuration
# ------------------------------------------------------------------------------
# Keyboard
repeat_rate=50
repeat_delay=250
xkb_rules_layout=us

# Trackpad
disable_trackpad=0
tap_to_click=1
disable_while_typing=1

# Misc Input
sloppyfocus=2
warpcursor=1

# ------------------------------------------------------------------------------
# Key Bindings
# ------------------------------------------------------------------------------

# System & Management
bind=SUPER+SHIFT,q,spawn,uwsm stop
bind=SUPER+SHIFT,r,reload_config
bind=SUPER,q,killclient,
bind=SUPER+ALT,q,killclient,

# Application Launchers
bind=SUPER,escape,spawn,noctalia msg panel-toggle session
bind=SUPER,x,spawn,noctalia msg session lock
bind=SUPER,t,spawn,uwsm app -- kitty
bind=SUPER,n,spawn,uwsm app -- neovide
bind=SUPER,e,spawn,uwsm app -- nautilus
bind=SUPER,r,spawn,noctalia msg panel-toggle launcher
bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,b,spawn,uwsm app -- firefox
bind=SUPER+SHIFT,b,spawn,uwsm app -- firefox --private-window
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center system

# Media Control Keys
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down
bind=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bind=NONE,XF86AudioPause,spawn,noctalia msg media toggle
bind=NONE,XF86AudioStop,spawn,noctalia msg media stop
bind=NONE,XF86AudioNext,spawn,noctalia msg media next
bind=NONE,XF86AudioPrev,spawn,noctalia msg media previous

# Screenshots
bind=SUPER,p,spawn,noctalia msg screenshot-fullscreen all
bind=SUPER+SHIFT,p,spawn,noctalia msg screenshot-region
bind=NONE,Print,spawn,noctalia msg screenshot-region

# Window Focus Manipulation
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev

# Window State & Layout Manipulation
bind=SUPER,f,togglefloating,
bind=SUPER,m,togglefullscreen,
bind=NONE,F11,togglefullscreen,

# Window Swap
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,l,exchange_client,right
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,j,exchange_client,down

# Move Window Directionally
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down

# Resize Window
bind=SUPER+ALT,h,resizewin,-10,+0
bind=SUPER+ALT,l,resizewin,+10,+0
bind=SUPER+ALT,k,resizewin,+0,-10
bind=SUPER+ALT,j,resizewin,+0,+10

# Move Window Pixels
bind=SUPER+SHIFT+ALT,h,movewin,-20,+0
bind=SUPER+SHIFT+ALT,l,movewin,+20,+0
bind=SUPER+SHIFT+ALT,k,movewin,+0,-20
bind=SUPER+SHIFT+ALT,j,movewin,+0,+20

# Workspace (Tag) Navigation & Allocation
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,10,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+SHIFT,0,tag,10,0

bind=SUPER,period,viewtoright,0
bind=SUPER,comma,viewtoleft,0
bind=SUPER+SHIFT,period,tagtoright,0
bind=SUPER+SHIFT,comma,tagtoleft,0

# Scratchpad (Special Workspace)
bind=SUPER,grave,toggle_scratchpad
bind=SUPER+SHIFT,grave,tag,scratchpad,0

# Mouse Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# noctalia
source=~/.config/mango/noctalia.conf
